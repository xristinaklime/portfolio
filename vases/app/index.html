<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hall of Vases – στον browser</title>
<style>
  html,body{margin:0;height:100%;background:#0f1726;color:#e9e7e1;font-family:"Noto Sans","Helvetica Neue",Arial,sans-serif;overflow:hidden}
  #unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#1a2130;outline:none}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;background:#0f1726}
  #loading h1{font-family:"GFS Didot",Didot,serif;font-weight:400;font-size:clamp(28px,5vw,44px);margin:0}
  #loading p{margin:0;color:#a3acb8;max-width:46ch}
  .bar{width:min(320px,80vw);height:6px;border-radius:3px;background:#2c3542;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#e08a6c;transition:width .2s}
  #help{position:fixed;left:12px;bottom:12px;padding:8px 12px;border-radius:6px;background:rgba(15,23,38,.78);font-size:13px;line-height:1.5;color:#e9e7e1;pointer-events:none}
  #back{position:fixed;right:12px;top:12px;padding:6px 12px;border-radius:6px;background:rgba(15,23,38,.78);color:#e9e7e1;font-size:14px;text-decoration:none}
  #back:hover{background:rgba(31,90,134,.9)}
  #help[hidden],#loading[hidden]{display:none}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading">
  <h1>The Hall of Vases</h1>
  <p>Φόρτωση της αίθουσας… Την πρώτη φορά μπορεί να χρειαστεί λίγος χρόνος.</p>
  <div class="bar"><i id="progress"></i></div>
  <p id="mobile" hidden>Η εκδοχή για browser θέλει υπολογιστή με πληκτρολόγιο και ποντίκι.</p>
</div>
<div id="help" hidden><b>W A S D</b> ή βέλη: περπάτημα · <b>σύρσιμο</b>: κοίτα γύρω · <b>κλικ</b>: κουμπιά · <b>κράτα το κλικ</b>: σήκωσε αγγείο</div>
<a id="back" href="../">← Πίσω στη σελίδα</a>
<script src="Build/hall_web.loader.js"></script>
<script>
  if (matchMedia("(pointer:coarse)").matches) document.getElementById("mobile").hidden = false;
  var canvas = document.getElementById("unity-canvas");
  createUnityInstance(canvas, {
    dataUrl: "Build/hall_web.data.unityweb",
    frameworkUrl: "Build/hall_web.framework.js.unityweb",
    codeUrl: "Build/hall_web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Christina Klimedioti",
    productName: "The Hall of Vases",
    productVersion: "1.0",
    matchWebGLToCanvasSize: true,
    autoSyncPersistentDataPath: true
  }, function (p) {
    document.getElementById("progress").style.width = Math.round(p * 100) + "%";
  }).then(function (unity) {
    // Pass every left press to the app, so that even a very quick tap on a button counts.
    canvas.addEventListener("pointerdown", function (e) {
      if (e.button !== 0) return;
      var r = canvas.getBoundingClientRect();
      var x = (e.clientX - r.left) * canvas.width / r.width;
      var y = canvas.height - (e.clientY - r.top) * canvas.height / r.height;
      unity.SendMessage("Desktop Visitor", "JsPress", x.toFixed(1) + "," + y.toFixed(1));
    });
    document.getElementById("loading").hidden = true;
    document.getElementById("help").hidden = false;
    canvas.focus();
  }).catch(function (e) {
    document.querySelector("#loading p").textContent = "Η εφαρμογή δεν μπόρεσε να φορτώσει σε αυτόν τον browser. Δοκίμασε Chrome, Edge ή Firefox σε υπολογιστή.";
    console.error(e);
  });
</script>
</body>
</html>
